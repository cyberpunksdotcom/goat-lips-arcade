<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: 'Permanent Marker';
        src: url('../../node_modules/@fontsource/permanent-marker/files/permanent-marker-latin-400-normal.woff2') format('woff2');
      }
      html, body { margin: 0; }
      .og {
        position: relative; width: 1200px; height: 630px; overflow: hidden;
        background:
          radial-gradient(70% 70% at 30% 20%, rgba(244, 178, 35, 0.22), transparent 60%),
          repeating-linear-gradient(90deg, #3a2414 0 46px, #2f1d10 46px 48px, #35210f 48px 94px, #2a190d 94px 96px);
      }
      .logo { position: absolute; left: 70px; top: 40px; width: 330px; }
      .title {
        position: absolute; left: 66px; top: 360px; margin: 0;
        font-family: 'Permanent Marker'; font-size: 104px; line-height: 1; color: #f5edd9;
        text-shadow: 0 4px 0 rgba(0, 0, 0, 0.45);
      }
      .title::after {
        content: ''; display: block; width: 360px; height: 12px; margin-top: 10px; border-radius: 8px 3px 9px 2px;
        background: #d11b1b; box-shadow: 34px 14px 0 -2px #f4b223; transform: rotate(-1.5deg);
      }
      .sub { position: absolute; left: 70px; top: 530px; font: 600 30px system-ui, sans-serif; color: rgba(245, 237, 217, 0.85); }
      .goat { position: absolute; right: 50px; bottom: 26px; height: 560px; filter: drop-shadow(0 14px 18px rgba(0, 0, 0, 0.45)); }
      .lights { position: absolute; left: 0; right: 0; top: 14px; height: 30px;
        background: radial-gradient(circle at 15px 15px, #fff1cc 3px, rgba(244, 178, 35, 0.35) 7px, transparent 15px) 0 0 / 100px 30px repeat-x; }
    </style>
  </head>
  <body>
    <div class="og">
      <div class="lights"></div>
      <img class="logo" src="../../src/assets/logo-stacked.webp" alt="" />
      <h1 class="title">Slide 'Em</h1>
      <div class="sub">A Goat Lips game · play the beta</div>
      <img class="goat" src="goat-hires.webp" alt="" />
    </div>
  </body>
</html>
